# Generated by indexer/render-pipeline.py. Do not edit by hand.
# The tracked contracts are rows in the streamling.testnet_tracked_* tables, not in this file.
# The sink urls carry a placeholder for the Webhook Manager's address, which contains a secret:
# `render-pipeline.py --fill` writes the copy to apply (see indexer/README.md).
name: bwb-stellar-testnet
description: BWB contract events and liveness heartbeat on Stellar testnet, delivered to the Webhook Manager
resource_size: xs
sources:
  stellar_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 5177900
    fetch_parallelism: 2
  stellar_ledgers:
    type: dataset
    dataset_name: stellar_testnet.ledgers
    version: 1.2.0
    start_at: 5177900
    fetch_parallelism: 2
transforms:
  tracked_tokens:
    type: dynamic_table
    backend_type: Postgres
    backend_entity_name: testnet_tracked_tokens
    secret_name: BWB_INDEXER_POSTGRES
    max_connections: 2
  tracked_sales:
    type: dynamic_table
    backend_type: Postgres
    backend_entity_name: testnet_tracked_sales
    secret_name: BWB_INDEXER_POSTGRES
    max_connections: 2
  tracked_allowlists:
    type: dynamic_table
    backend_type: Postgres
    backend_entity_name: testnet_tracked_allowlists
    secret_name: BWB_INDEXER_POSTGRES
    max_connections: 2
  tracked_assets:
    type: dynamic_table
    backend_type: Postgres
    backend_entity_name: testnet_tracked_assets
    secret_name: BWB_INDEXER_POSTGRES
    max_connections: 2
  bwb_contract_events:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id, contract_id, topics, data,
        transaction_hash, transaction_successful, in_successful_contract_call,
        ledger_sequence, ledger_closed_at,
        'cee0302d59844d32bdca915c8203dd44b33fbb7edc19051ea37abedf28ecd472' AS chain_id,
        CASE
          WHEN dynamic_table_check('tracked_tokens', contract_id) THEN 'token'
          WHEN dynamic_table_check('tracked_sales', contract_id) THEN 'sale'
          WHEN dynamic_table_check('tracked_allowlists', contract_id) THEN 'allowlist'
          WHEN dynamic_table_check('tracked_assets', contract_id) THEN 'asset'
        END AS contract_kind
      FROM stellar_events
      WHERE type = 'contract'
        AND (
          dynamic_table_check('tracked_tokens', contract_id)
          OR dynamic_table_check('tracked_sales', contract_id)
          OR dynamic_table_check('tracked_allowlists', contract_id)
          OR dynamic_table_check('tracked_assets', contract_id)
        )
  heartbeat:
    type: sql
    primary_key: ledger_sequence
    sql: |
      SELECT
        ledger_sequence, ledger_closed_at,
        'cee0302d59844d32bdca915c8203dd44b33fbb7edc19051ea37abedf28ecd472' AS chain_id
      FROM stellar_ledgers
      WHERE ledger_sequence % 720 = 0
sinks:
  convex_events:
    type: webhook
    from: bwb_contract_events
    url: ${WEBHOOK_MANAGER_URL}/webhooks/goldsky/events
    secret_name: BWB_GOLDSKY_WEBHOOK
    one_row_per_request: false
    batch_size: 100
    batch_flush_interval: 1s
  convex_heartbeat:
    type: webhook
    from: heartbeat
    url: ${WEBHOOK_MANAGER_URL}/webhooks/goldsky/heartbeat
    secret_name: BWB_GOLDSKY_WEBHOOK
    one_row_per_request: false
    batch_size: 10
    batch_flush_interval: 1s
