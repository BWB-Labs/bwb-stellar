[package]
name = "offer-sale"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-contract-utils = { workspace = true }
stellar-macros = { workspace = true }

# The real siblings, for the tests only: the contract code talks to them
# through a hand-written client trait and the standard token client, so
# this WASM exports nothing of theirs.
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
offer-allowlist = { path = "../offer-allowlist" }
offer-token = { path = "../offer-token" }
