name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/contracts.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # target and components.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      # OpenZeppelin 0.7.2 enables soroban-sdk's spec-shaking feature, which
      # only builds through the Stellar CLI. Pin the CLI to the version used
      # for deploys so hashes match deployments/*.json.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.1.0

      - name: Build WASM
        run: stellar contract build
