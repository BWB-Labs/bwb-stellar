# TypeScript SDK checks. Owned by the BWB team; moved here unchanged from the
# previous ci.yml so that it only runs when sdk/ changes.
name: sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"

jobs:
  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK deps
        run: npm ci --prefix sdk

      - name: Build SDK
        run: npm run build --prefix sdk

      - name: Test SDK
        run: npm test --prefix sdk
