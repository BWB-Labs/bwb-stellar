# TypeScript SDK checks: typecheck, build and the test suite of @bwb/stellar-sdk.
name: sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"

jobs:
  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install SDK deps
        run: bun install --frozen-lockfile

      - name: Typecheck SDK
        run: bun run typecheck

      - name: Build SDK
        run: bun run build

      - name: Test SDK
        run: bun run test
